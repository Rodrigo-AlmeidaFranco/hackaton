<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="1100" height="320" fill="#F8F9FF" rx="16"/>
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1A237E">STRIDE AI Threat Modeler — Pipeline</text>

  <!-- ── Box 1: Diagrama (x=80) ── -->
  <g transform="translate(80,65)">
    <rect width="148" height="190" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <rect x="20" y="16" width="108" height="78" rx="6" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.5"/>
    <circle cx="40" cy="34" r="9" fill="#1565C0" opacity="0.45"/>
    <polygon points="20,78 56,48 80,64 106,40 128,58 128,94 20,94" fill="#1565C0" opacity="0.3"/>
    <text x="74" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#0D47A1">Diagrama</text>
    <text x="74" y="136" text-anchor="middle" font-size="12" fill="#1565C0">de Arquitetura</text>
    <text x="74" y="154" text-anchor="middle" font-size="11" fill="#5C6BC0">PNG / JPG / BMP</text>
    <circle cx="74" cy="178" r="12" fill="#1565C0"/>
    <text x="74" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="white">1</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="234" y1="160" x2="272" y2="160" stroke="#90A4AE" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="272,153 286,160 272,167" fill="#90A4AE"/>

  <!-- ── Box 2: YOLOv8 (x=278) ── -->
  <g transform="translate(278,65)">
    <rect width="148" height="190" rx="12" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <rect x="16" y="14" width="116" height="82" rx="6" fill="#FFE0B2" stroke="#E65100" stroke-width="1.5"/>
    <rect x="28" y="24" width="44" height="36" rx="3" fill="none" stroke="#E65100" stroke-width="2"/>
    <rect x="84" y="36" width="32" height="26" rx="3" fill="none" stroke="#FB8C00" stroke-width="2"/>
    <circle cx="50" cy="42" r="8" fill="#E65100" opacity="0.55"/>
    <line x1="72" y1="30" x2="72" y2="96" stroke="#E65100" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
    <text x="74" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#BF360C">YOLOv8</text>
    <text x="74" y="138" text-anchor="middle" font-size="12" fill="#E65100">Detecção Visual</text>
    <text x="74" y="156" text-anchor="middle" font-size="11" fill="#FF8F00">12 ou 111 classes</text>
    <circle cx="74" cy="178" r="12" fill="#E65100"/>
    <text x="74" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="white">2</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="432" y1="160" x2="470" y2="160" stroke="#90A4AE" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="470,153 484,160 470,167" fill="#90A4AE"/>

  <!-- ── Box 3: Knowledge Base (x=476) ── -->
  <g transform="translate(476,65)">
    <rect width="148" height="190" rx="12" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
    <ellipse cx="74" cy="34" rx="50" ry="16" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.5"/>
    <rect x="24" y="34" width="100" height="42" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="1.5"/>
    <ellipse cx="74" cy="76" rx="50" ry="16" fill="#CE93D8" stroke="#6A1B9A" stroke-width="1.5"/>
    <text x="74" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#4A148C">STRIDE Engine</text>
    <text x="74" y="138" text-anchor="middle" font-size="12" fill="#6A1B9A">Knowledge Base</text>
    <text x="74" y="156" text-anchor="middle" font-size="11" fill="#8E24AA">400+ ameaças</text>
    <circle cx="74" cy="178" r="12" fill="#6A1B9A"/>
    <text x="74" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="white">3</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="630" y1="160" x2="668" y2="160" stroke="#90A4AE" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="668,153 682,160 668,167" fill="#90A4AE"/>

  <!-- ── Box 4: LLM (x=674) ── -->
  <g transform="translate(674,65)">
    <rect width="148" height="190" rx="12" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
    <circle cx="74" cy="50" r="34" fill="#B2EBF2" stroke="#00838F" stroke-width="1.5"/>
    <circle cx="58" cy="42" r="9" fill="#00838F" opacity="0.4"/>
    <circle cx="90" cy="42" r="9" fill="#00838F" opacity="0.4"/>
    <circle cx="74" cy="62" r="7" fill="#00838F" opacity="0.4"/>
    <line x1="58" y1="42" x2="90" y2="42" stroke="#00838F" stroke-width="1.5" opacity="0.6"/>
    <line x1="58" y1="42" x2="74" y2="62" stroke="#00838F" stroke-width="1.5" opacity="0.6"/>
    <line x1="90" y1="42" x2="74" y2="62" stroke="#00838F" stroke-width="1.5" opacity="0.6"/>
    <text x="74" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#006064">Análise LLM</text>
    <text x="74" y="138" text-anchor="middle" font-size="12" fill="#00838F">Claude / GPT / Gemini</text>
    <text x="74" y="156" text-anchor="middle" font-size="11" fill="#0097A7">Groq / Ollama</text>
    <circle cx="74" cy="178" r="12" fill="#00838F"/>
    <text x="74" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="white">4</text>
  </g>

  <!-- Arrow 4→5 -->
  <line x1="828" y1="160" x2="866" y2="160" stroke="#90A4AE" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="866,153 880,160 866,167" fill="#90A4AE"/>

  <!-- ── Box 5: PDF (x=872) ── -->
  <g transform="translate(872,65)">
    <rect width="148" height="190" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <!-- document icon -->
    <rect x="30" y="12" width="88" height="76" rx="4" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5"/>
    <polygon points="88,12 118,12 118,40" fill="#A5D6A7" stroke="#2E7D32" stroke-width="1"/>
    <line x1="42" y1="52" x2="106" y2="52" stroke="#2E7D32" stroke-width="2" opacity="0.5"/>
    <line x1="42" y1="64" x2="106" y2="64" stroke="#2E7D32" stroke-width="2" opacity="0.5"/>
    <line x1="42" y1="76" x2="80" y2="76" stroke="#2E7D32" stroke-width="2" opacity="0.5"/>
    <text x="74" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1B5E20">Relatório PDF</text>
    <text x="74" y="138" text-anchor="middle" font-size="12" fill="#2E7D32">Ameaças + CWEs</text>
    <text x="74" y="156" text-anchor="middle" font-size="11" fill="#388E3C">Recomendações</text>
    <circle cx="74" cy="178" r="12" fill="#2E7D32"/>
    <text x="74" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="white">5</text>
  </g>

  <!-- Bottom tagline -->
  <rect x="80" y="278" width="940" height="28" rx="8" fill="#E8EAF6" stroke="#3949AB" stroke-width="1"/>
  <text x="550" y="297" text-anchor="middle" font-size="12" fill="#283593">
    Tempo de análise: segundos — substitui horas de trabalho manual por um especialista
  </text>

</svg>
